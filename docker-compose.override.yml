services:
  web:
    build:
      target: development
    environment:
      VITE_NORA_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/workspace/frontend
      - web_node_modules:/workspace/frontend/node_modules
  api:
    build:
      target: development
    environment:
      ENV: ${ENV:-dev}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      PYTHONPYCACHEPREFIX: /workspace/backend/.cache/pycache
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nora}:${POSTGRES_PASSWORD:-change-me-local}@db:5432/${POSTGRES_DB:-nora}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-development-only-change-this-secret}
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-30}
    volumes:
      - .:/workspace
    command: ["uvicorn", "app.apps.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: development
    volumes:
      - .:/workspace
    environment:
      PYTHONPYCACHEPREFIX: /workspace/backend/.cache/pycache
    command: ["bash"]

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: development
    environment:
      PYTHONPYCACHEPREFIX: /workspace/backend/.cache/pycache
      DATABASE_URL: postgresql+asyncpg://nora_test:nora_test@test-db:5432/nora_test
      TEST_DATABASE_URL: postgresql+asyncpg://nora_test:nora_test@test-db:5432/nora_test
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - .:/workspace
    command: ["pytest", "tests/unit", "tests/integration", "tests/architecture", "-q"]

  test-db:
    profiles: ["test"]
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: nora_test
      POSTGRES_PASSWORD: nora_test
      POSTGRES_DB: nora_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  web_node_modules:
