name: Frontend quality gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect frontend changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- frontend .github/workflows/frontend-ci.yml; then
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "No frontend or frontend workflow changes; quality commands will be skipped."
          else
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "Frontend changes detected; running the complete quality gate."
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Unit and component tests
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run test

      - name: Production build
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

      - name: Confirm skip
        if: steps.changes.outputs.frontend != 'true'
        run: echo "Frontend quality gate skipped because no frontend paths changed."
