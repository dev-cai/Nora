name: Beta deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy an immutable main Commit or roll back to a healthy release
        type: choice
        options: [deploy, rollback]
        default: deploy
        required: true
      commit_sha:
        description: Full protected main Commit SHA for deploy
        type: string
        required: false
      rollback_release_id:
        description: Known healthy release ID for rollback
        type: string
        required: false
      rollback_reason:
        description: Auditable operator reason for rollback
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: beta-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify protected main release gates
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      checks: read
      deployments: read
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      migration_revision: ${{ steps.migration.outputs.revision }}
    steps:
      - name: Validate deploy inputs
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          ROLLBACK_RELEASE_ID: ${{ inputs.rollback_release_id }}
        run: |
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -z "$ROLLBACK_RELEASE_ID"

      - name: Check out requested Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}

      - name: Verify Commit is on protected main
        id: source
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify required main CI checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python deploy/verify_release_ci.py
          --repository "$GITHUB_REPOSITORY"
          --commit-sha "${{ inputs.commit_sha }}"
          --output ci-check-runs.json

      - name: Verify protected Environment and dedicated Runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python deploy/verify_release_control.py --repository "$GITHUB_REPOSITORY"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: "0.11.3"

      - name: Read migration head from locked backend
        id: migration
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          revision=$(uv run alembic heads | awk 'NR == 1 {print $1}')
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Preserve verified CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-ci-evidence-${{ github.run_id }}
          path: ci-check-runs.json
          retention-days: 30

  build:
    name: Build immutable images and release evidence
    if: inputs.operation == 'deploy'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out verified Commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}

      - name: Download verified CI evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: beta-ci-evidence-${{ github.run_id }}

      - name: Log in to GHCR with the workflow token
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push API and Web images
        id: images
        env:
          COMMIT_SHA: ${{ needs.verify.outputs.commit_sha }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          api_tag="ghcr.io/$owner/nora-api:$COMMIT_SHA-$GITHUB_RUN_ID"
          web_tag="ghcr.io/$owner/nora-web:$COMMIT_SHA-$GITHUB_RUN_ID"
          docker build --file docker/Dockerfile.api --target runtime --tag "$api_tag" .
          docker build --file docker/Dockerfile.web --target runtime --tag "$web_tag" .
          docker push "$api_tag"
          docker push "$web_tag"
          docker pull "$api_tag"
          docker pull "$web_tag"
          api_image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$api_tag")
          web_image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$web_tag")
          {
            echo "api_image=$api_image"
            echo "web_image=$web_image"
            echo "api_digest=${api_image##*@}"
            echo "web_digest=${web_image##*@}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate API SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.images.outputs.api_image }}
          format: spdx-json
          output-file: sbom-api.spdx.json
          upload-artifact: false

      - name: Generate Web SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.images.outputs.web_image }}
          format: spdx-json
          output-file: sbom-web.spdx.json
          upload-artifact: false

      - name: Attest API build provenance
        id: api-provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/dev-cai/nora-api
          subject-digest: ${{ steps.images.outputs.api_digest }}
          push-to-registry: true

      - name: Attest Web build provenance
        id: web-provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/dev-cai/nora-web
          subject-digest: ${{ steps.images.outputs.web_digest }}
          push-to-registry: true

      - name: Attest API SBOM
        uses: actions/attest-sbom@10926c72720ffc3f7b666661c8e55b1344e2a365 # v2
        with:
          subject-name: ghcr.io/dev-cai/nora-api
          subject-digest: ${{ steps.images.outputs.api_digest }}
          sbom-path: sbom-api.spdx.json
          push-to-registry: true

      - name: Attest Web SBOM
        uses: actions/attest-sbom@10926c72720ffc3f7b666661c8e55b1344e2a365 # v2
        with:
          subject-name: ghcr.io/dev-cai/nora-web
          subject-digest: ${{ steps.images.outputs.web_digest }}
          sbom-path: sbom-web.spdx.json
          push-to-registry: true

      - name: Create immutable release manifest
        env:
          API_ATTESTATION_URL: ${{ steps.api-provenance.outputs.attestation-url }}
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          COMMIT_SHA: ${{ needs.verify.outputs.commit_sha }}
          MIGRATION_REVISION: ${{ needs.verify.outputs.migration_revision }}
          WEB_ATTESTATION_URL: ${{ steps.web-provenance.outputs.attestation-url }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
        run: |
          api_sbom_sha256=$(sha256sum sbom-api.spdx.json | awk '{print $1}')
          web_sbom_sha256=$(sha256sum sbom-web.spdx.json | awk '{print $1}')
          cp deploy/schema-compatibility.json schema-compatibility.json
          python deploy/release_manifest.py create \
            --output release-manifest.json \
            --commit-sha "$COMMIT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --ci-check-runs ci-check-runs.json \
            --api-image "$API_IMAGE" \
            --web-image "$WEB_IMAGE" \
            --api-sbom-sha256 "$api_sbom_sha256" \
            --web-sbom-sha256 "$web_sbom_sha256" \
            --api-attestation-url "$API_ATTESTATION_URL" \
            --web-attestation-url "$WEB_ATTESTATION_URL" \
            --migration-revision "$MIGRATION_REVISION" \
            --schema-compatibility-policy schema-compatibility.json
          python deploy/release_manifest.py validate release-manifest.json

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-release-${{ github.run_id }}
          path: |
            release-manifest.json
            ci-check-runs.json
            schema-compatibility.json
            sbom-api.spdx.json
            sbom-web.spdx.json
          retention-days: 90

  deploy:
    name: Deploy through the fixed Beta host entrypoint
    if: inputs.operation == 'deploy'
    needs: [verify, build]
    runs-on: [self-hosted, linux, x64, nora-beta-deploy]
    environment: beta
    permissions:
      contents: read
      checks: read
      packages: read
      attestations: read
    steps:
      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: beta-release-${{ github.run_id }}

      - name: Invoke the root-owned release entrypoint
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: >-
          printf '%s' "$REGISTRY_TOKEN" |
          sudo --non-interactive /usr/local/sbin/nora-release
          deploy "$PWD/release-manifest.json" "$GITHUB_ACTOR"

  rollback:
    name: Roll back to a known healthy compatible release
    if: inputs.operation == 'rollback'
    runs-on: [self-hosted, linux, x64, nora-beta-deploy]
    environment: beta
    steps:
      - name: Validate rollback inputs
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_ID: ${{ inputs.rollback_release_id }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
        run: |
          test -z "$COMMIT_SHA"
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{12}-[1-9][0-9]*$ ]]
          test -n "$ROLLBACK_REASON"

      - name: Invoke the same root-owned release entrypoint
        env:
          RELEASE_ID: ${{ inputs.rollback_release_id }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
        run: >-
          sudo --non-interactive /usr/local/sbin/nora-release
          rollback "$RELEASE_ID" "$ROLLBACK_REASON"
