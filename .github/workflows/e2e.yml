name: Browser E2E

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E (decision flow)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 先以 runner 用户安装依赖与浏览器，再启动 compose：
      # 避免 compose override 的 bind mount 以 root 改写 node_modules 后 npm ci 报 EACCES。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
        # 不使用 npm cache：与 frontend-ci.yml 同 PR 并发会共享同一 cache key，
        # 出现 EACCES / 半损坏缓存；E2E 门禁宁可慢一点也要稳定。

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start compose stack
        run: |
          cp backend/.env.example .env
          docker compose up -d --build db api web

      - name: Apply database migrations
        run: docker compose exec api alembic upgrade head

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8000/ready >/dev/null 2>&1 && curl --fail --silent --show-error http://localhost:5173 >/dev/null 2>&1; then
              echo "Web and API are ready."
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become ready in time." >&2
          docker compose ps
          exit 1

      - name: Run web-to-API smoke
        working-directory: frontend
        run: npm run integration:smoke
        env:
          NORA_WEB_URL: http://localhost:5173

      - name: Run browser E2E
        working-directory: frontend
        run: npm run e2e
        env:
          NORA_WEB_URL: http://localhost:5173

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Clean isolated compose environment
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
