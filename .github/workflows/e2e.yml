name: Browser E2E

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E (decision flow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NORA_E2E_PROJECT: nora-e2e-${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 先以 runner 用户安装依赖与浏览器，再启动 compose：
      # 避免 compose override 的 bind mount 以 root 改写 node_modules 后 npm ci 报 EACCES。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
        # 不使用 npm cache：与 frontend-ci.yml 同 PR 并发会共享同一 cache key，
        # 出现 EACCES / 半损坏缓存；E2E 门禁宁可慢一点也要稳定。

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start compose stack
        run: |
          cp backend/.env.example .env
          docker compose -p "$NORA_E2E_PROJECT" up -d --build db api web

      - name: Apply database migrations
        run: docker compose -p "$NORA_E2E_PROJECT" exec -T api alembic upgrade head

      - name: Wait for services
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8000/ready >/dev/null 2>&1 && curl --fail --silent --show-error http://localhost:5173 >/dev/null 2>&1; then
              echo "Web and API are ready."
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become ready in time." >&2
          docker compose -p "$NORA_E2E_PROJECT" ps
          exit 1

      - name: Run web-to-API smoke
        working-directory: frontend
        run: npm run integration:smoke
        env:
          NORA_WEB_URL: http://localhost:5173

      - name: Run browser E2E
        working-directory: frontend
        run: npm run e2e
        env:
          NORA_WEB_URL: http://localhost:5173

      - name: Stop decision-flow stack before Beta security checks
        run: docker compose -p "$NORA_E2E_PROJECT" down --volumes --remove-orphans

      - name: Prepare isolated Beta security environment
        run: |
          umask 077
          beta_env="$RUNNER_TEMP/nora-beta-e2e.env"
          {
            printf 'BETA_E2E_PROJECT=nora-beta-e2e-%s\n' "$GITHUB_RUN_ID"
            printf 'BETA_E2E_POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'BETA_E2E_MINIO_ROOT_USER=betae2eroot\n'
            printf 'BETA_E2E_MINIO_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'BETA_E2E_ARTIFACT_ACCESS_KEY=betae2eapp\n'
            printf 'BETA_E2E_ARTIFACT_SECRET_KEY=%s\n' "$(openssl rand -hex 24)"
            printf 'BETA_E2E_ARTIFACT_BACKUP_ACCESS_KEY=betae2ebackup\n'
            printf 'BETA_E2E_ARTIFACT_BACKUP_SECRET_KEY=%s\n' "$(openssl rand -hex 24)"
            printf 'BETA_E2E_JWT_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'BETA_E2E_AUTH_RATE_LIMIT_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'BETA_E2E_OWNER_USERNAME=beta-owner\n'
            printf 'BETA_E2E_OWNER_EMAIL=beta-owner@example.invalid\n'
            printf 'BETA_E2E_OWNER_PASSWORD=%s\n' "$(openssl rand -hex 18)"
            printf 'BETA_E2E_OWNER_RECOVERY_PASSWORD=%s\n' "$(openssl rand -hex 18)"
          } > "$beta_env"

      - name: Start Host TLS reference-proxy Beta stack
        run: >-
          docker compose --env-file "$RUNNER_TEMP/nora-beta-e2e.env"
          -f docker-compose.beta-e2e.yml up -d --build

      - name: Wait for Host TLS reference proxy
        run: |
          for _ in $(seq 1 90); do
            if curl --insecure --fail --silent --show-error https://localhost:8443/api/ready >/dev/null 2>&1; then
              echo "Host TLS reference proxy is ready."
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file "$RUNNER_TEMP/nora-beta-e2e.env" -f docker-compose.beta-e2e.yml ps
          exit 1

      - name: Verify no model or external-write credentials are configured
        run: >-
          docker compose --env-file "$RUNNER_TEMP/nora-beta-e2e.env"
          -f docker-compose.beta-e2e.yml exec -T api python -c
          "import os; names=('OPENAI_API_KEY','ANTHROPIC_API_KEY','MODEL_API_KEY','LLM_API_KEY','RECRUITMENT_PLATFORM_TOKEN','MESSAGE_SENDER_TOKEN'); assert all(not os.getenv(name) for name in names)"

      - name: Run Beta production-security browser E2E
        working-directory: frontend
        run: |
          set -a
          . "$RUNNER_TEMP/nora-beta-e2e.env"
          set +a
          npm run e2e:beta
        env:
          BETA_E2E_COMPOSE_FILE: ${{ github.workspace }}/docker-compose.beta-e2e.yml
          BETA_E2E_ENV_FILE: ${{ runner.temp }}/nora-beta-e2e.env
          NORA_BETA_WEB_URL: https://localhost:8443

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Clean isolated compose environment
        if: ${{ always() }}
        run: |
          docker compose -p "$NORA_E2E_PROJECT" down --volumes --remove-orphans
          if [ -f "$RUNNER_TEMP/nora-beta-e2e.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/nora-beta-e2e.env" \
              -f docker-compose.beta-e2e.yml down --volumes --remove-orphans || true
            unlink "$RUNNER_TEMP/nora-beta-e2e.env"
          fi
          if [ -f "$GITHUB_WORKSPACE/.env" ]; then
            unlink "$GITHUB_WORKSPACE/.env"
          fi
