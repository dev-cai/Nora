name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Validate branch, title, and Issue link
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: python
        run: |
          import os
          import re
          import sys

          types = "feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert"
          branch = os.environ["PR_HEAD"]
          title = os.environ["PR_TITLE"]

          branch_pattern = rf"^nora/(?:{types})-[a-z0-9]+(?:-[a-z0-9]+)*$"
          title_pattern = rf"^(?:{types})(?:\([a-z0-9][a-z0-9._/-]*\))?: .+$"

          errors = []
          if not re.fullmatch(branch_pattern, branch):
              errors.append("分支必须符合 nora/<type>-<subject>")
          if not re.fullmatch(title_pattern, title):
              errors.append("PR 标题必须符合 <type>(<optional-scope>): <中文 subject>")
          if not re.search(r"[㐀-鿿]", title):
              errors.append("PR 标题 subject 必须包含中文")
          if re.match(r"^\[(?:Roadmap|Phase|Implementation|Bug|Docs)", title, re.I):
              errors.append("PR 标题不得使用固定方括号前缀")

          if errors:
              print("\n".join(f"::error::{error}" for error in errors))
              sys.exit(1)

          print("PR metadata is valid")

  quality:
    name: Code quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: nora
          POSTGRES_PASSWORD: nora
          POSTGRES_DB: nora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nora -d nora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.3"

      - name: Sync locked development environment
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app/

      - name: Unit and integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://nora:nora@127.0.0.1:5432/nora
        run: uv run pytest tests/unit tests/integration -q

      - name: Architecture tests
        run: uv run pytest tests/architecture -q

  containers:
    name: Container configuration and builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          docker compose --profile test config --quiet
          docker compose --env-file deploy/production.env.example \
            -f deploy/compose.production.yml \
            --profile initialize --profile ops config --quiet
          docker compose --env-file deploy/production.env.example \
            -f deploy/compose.production.yml \
            --profile initialize --profile ops config --format json \
            | python deploy/check_compose_security.py

      - name: Build API development target
        run: >-
          docker build --file docker/Dockerfile.api --target development
          --tag nora-api-development:ci .

      - name: Build API runtime target
        run: >-
          docker build --file docker/Dockerfile.api --target runtime
          --tag nora-api-runtime:ci .

      - name: Build Web runtime target
        run: >-
          docker build --file docker/Dockerfile.web --target runtime
          --tag nora-web-runtime:ci .

      - name: Build isolated test image
        run: docker compose --profile test build test

  supply-chain:
    name: Secret, dependency, SBOM, and vulnerability gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan repository for committed Secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

      - name: Build production runtime images
        run: |
          docker build --file docker/Dockerfile.api --target runtime --tag nora-api-runtime:security .
          docker build --file docker/Dockerfile.web --target runtime --tag nora-web-runtime:security .

      - name: Generate API image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: nora-api-runtime:security
          format: spdx-json
          output-file: sbom-api.spdx.json
          artifact-name: nora-api-sbom
          upload-artifact-retention: 30

      - name: Generate Web image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: nora-web-runtime:security
          format: spdx-json
          output-file: sbom-web.spdx.json
          artifact-name: nora-web-sbom
          upload-artifact-retention: 30

      - name: Reject fixed high or critical API vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: nora-api-runtime:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Reject fixed high or critical Web vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: nora-web-runtime:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  docs:
    name: Documentation quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test documentation contract checks
        run: python -m unittest discover -s scripts/docs/tests -v

      - name: Check documentation impact declaration
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/docs/check_impact.py --base origin/main --require-declaration

      - name: Check relative Markdown links
        run: python scripts/docs/check_links.py

      - name: Check document source-of-truth consistency
        run: python scripts/docs/check_consistency.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.23.2 "docs/**/*.md" "*.md"
