name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Validate branch, title, and Issue link
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: python
        run: |
          import os
          import re
          import sys

          types = "feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert"
          branch = os.environ["PR_HEAD"]
          title = os.environ["PR_TITLE"]

          branch_pattern = rf"^nora/(?:{types})-[a-z0-9]+(?:-[a-z0-9]+)*$"
          title_pattern = rf"^(?:{types})(?:\([a-z0-9][a-z0-9._/-]*\))?: .+$"

          errors = []
          if not re.fullmatch(branch_pattern, branch):
              errors.append("分支必须符合 nora/<type>-<subject>")
          if not re.fullmatch(title_pattern, title):
              errors.append("PR 标题必须符合 <type>(<optional-scope>): <中文 subject>")
          if not re.search(r"[㐀-鿿]", title):
              errors.append("PR 标题 subject 必须包含中文")
          if re.match(r"^\[(?:Roadmap|Phase|Implementation|Bug|Docs)", title, re.I):
              errors.append("PR 标题不得使用固定方括号前缀")

          if errors:
              print("\n".join(f"::error::{error}" for error in errors))
              sys.exit(1)

          print("PR metadata is valid")

  quality:
    name: Code quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: nora
          POSTGRES_PASSWORD: nora
          POSTGRES_DB: nora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nora -d nora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.3"

      - name: Sync locked development environment
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app/

      - name: Unit and integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://nora:nora@127.0.0.1:5432/nora
        run: uv run pytest tests/unit tests/integration -q

      - name: Architecture tests
        run: uv run pytest tests/architecture -q

  containers:
    name: Container configuration and builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --profile test config --quiet

      - name: Build API development target
        run: >-
          docker build --file docker/Dockerfile.api --target development
          --tag nora-api-development:ci .

      - name: Build API runtime target
        run: >-
          docker build --file docker/Dockerfile.api --target runtime
          --tag nora-api-runtime:ci .

      - name: Build isolated test image
        run: docker compose --profile test build test

  docs:
    name: Documentation quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check relative Markdown links
        run: python scripts/docs/check_links.py

      - name: Check document source-of-truth consistency
        run: python scripts/docs/check_consistency.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.23.2 "docs/**/*.md" "*.md"
