name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Validate branch, title, and Issue link
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: python
        run: |
          import os
          import re
          import sys

          types = "feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert"
          branch = os.environ["PR_HEAD"]
          title = os.environ["PR_TITLE"]

          branch_pattern = rf"^nora/(?:{types})-[a-z0-9]+(?:-[a-z0-9]+)*$"
          title_pattern = rf"^(?:{types})(?:\([a-z0-9][a-z0-9._/-]*\))?: .+$"

          errors = []
          if not re.fullmatch(branch_pattern, branch):
              errors.append("分支必须符合 nora/<type>-<subject>")
          if not re.fullmatch(title_pattern, title):
              errors.append("PR 标题必须符合 <type>(<optional-scope>): <中文 subject>")
          if not re.search(r"[㐀-鿿]", title):
              errors.append("PR 标题 subject 必须包含中文")
          if re.match(r"^\[(?:Roadmap|Phase|Implementation|Bug|Docs)", title, re.I):
              errors.append("PR 标题不得使用固定方括号前缀")

          if errors:
              print("\n".join(f"::error::{error}" for error in errors))
              sys.exit(1)

          print("PR metadata is valid")

  quality:
    name: Code quality and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nora
          POSTGRES_PASSWORD: nora
          POSTGRES_DB: nora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nora -d nora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.3"

      - name: Sync locked development environment
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/

      - name: Unit and integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://nora:nora@127.0.0.1:5432/nora
        run: uv run pytest tests/unit tests/integration -q

      - name: Architecture tests
        run: uv run pytest tests/architecture -q
