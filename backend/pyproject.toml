[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nora-job-agent"
version = "0.1.0"
description = "面向求职决策的可审计智能体平台"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agent", "career", "decision-support", "rag"]
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pillow>=10,<12",
    "pwdlib[argon2]>=0.2,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic-settings>=2.0,<3",
    "pyjwt>=2.9,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.0,<26",
    "uvicorn[standard]>=0.30,<1",
    "minio>=7.2,<8",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.8,<1",
]

[project.urls]
Documentation = "https://github.com/dev-cai/Nora/tree/main/docs"
Issues = "https://github.com/dev-cai/Nora/issues"
Repository = "https://github.com/dev-cai/Nora"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.venv",
    "/dist",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
exclude = [".codex", ".venv", "dist"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
cache_dir = ".cache/pytest"

[tool.mypy]
python_version = "3.11"
files = ["app"]
cache_dir = ".cache/mypy"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
