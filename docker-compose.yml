services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: runtime
    depends_on:
      - api
    environment:
      VITE_NORA_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    environment:
      ENV: ${ENV:-dev}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nora}:${POSTGRES_PASSWORD:-change-me-local}@db:5432/${POSTGRES_DB:-nora}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-development-only-change-this-secret}
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-30}
      E2E_FAKE_MODEL: ${E2E_FAKE_MODEL:-0}
      BAIDU_OCR_API_KEY: ${BAIDU_OCR_API_KEY:-}
      BAIDU_OCR_SECRET_KEY: ${BAIDU_OCR_SECRET_KEY:-}
      BAIDU_OCR_ENDPOINT: ${BAIDU_OCR_ENDPOINT:-accurate_basic}
      ARTIFACT_STORAGE_ENDPOINT: storage:9000
      ARTIFACT_STORAGE_ACCESS_KEY: ${ARTIFACT_STORAGE_ACCESS_KEY:-nora-app}
      ARTIFACT_STORAGE_SECRET_KEY: ${ARTIFACT_STORAGE_SECRET_KEY:-development-artifact-secret}
      ARTIFACT_STORAGE_BUCKET: ${ARTIFACT_STORAGE_BUCKET:-nora-artifacts}
      ARTIFACT_STORAGE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["uvicorn", "app.apps.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]

  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: ${POSTGRES_DB:-nora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    command: ["python", "scripts/init_artifact_storage.py"]
    environment:
      ARTIFACT_STORAGE_ENDPOINT: storage:9000
      ARTIFACT_STORAGE_ACCESS_KEY: ${ARTIFACT_STORAGE_ACCESS_KEY:-nora-app}
      ARTIFACT_STORAGE_SECRET_KEY: ${ARTIFACT_STORAGE_SECRET_KEY:-development-artifact-secret}
      ARTIFACT_BACKUP_ACCESS_KEY: ${ARTIFACT_BACKUP_ACCESS_KEY:-nora-backup}
      ARTIFACT_BACKUP_SECRET_KEY: ${ARTIFACT_BACKUP_SECRET_KEY:-development-backup-secret}
      ARTIFACT_STORAGE_BUCKET: ${ARTIFACT_STORAGE_BUCKET:-nora-artifacts}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local}
    depends_on:
      storage:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
